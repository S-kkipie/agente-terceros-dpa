[project]
name = "agente-terceros"
version = "0.1.0"
description = "Agente de Terceros (DPAs) del PIMS multiagente ISO/IEC 27701:2025"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "flask>=3.1.3",
    "google-genai>=2.27.0",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
agente-terceros = "agente_terceros.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente_terceros"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
